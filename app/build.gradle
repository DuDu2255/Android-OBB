plugins {
    id 'com.android.application' version '8.1.0'
}

android {
    namespace 'com.example.obbinstaller'
    compileSdk 33

    defaultConfig {
        applicationId 'com.example.obbinstaller'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
