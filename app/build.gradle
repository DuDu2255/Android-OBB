plugins {
    id 'com.android.application' version '8.2.0'
}

android {
    namespace 'com.example.obbinstaller'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.obbinstaller'
        minSdk 21
        targetSdk 29
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
