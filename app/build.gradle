plugins {
    id 'com.android.application' version '8.2.0'
}

android {
    namespace 'com.example.obbinstaller'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.obbinstaller'
        minSdk 21
        targetSdk 29
        versionCode 5
        versionName '2.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

def payloadDexDir = layout.buildDirectory.dir('generated/payloadDex')
tasks.register('generatePayloadDex') {
    dependsOn ':payload:compileDebugJavaWithJavac'
    outputs.dir payloadDexDir
    doLast {
        def output = payloadDexDir.get().asFile
        delete output
        output.mkdirs()
        exec {
            commandLine "${android.sdkDirectory}/build-tools/34.0.0/d8",
                    '--min-api', '21',
                    '--output', output.absolutePath,
                    "${rootProject.projectDir}/payload/build/intermediates/javac/debug/classes"
        }
    }
}
preBuild.dependsOn generatePayloadDex
android.sourceSets.main.assets.srcDir payloadDexDir
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'net.dongliu:apk-parser:2.6.10'
    implementation 'org.smali:dexlib2:2.5.2'
    implementation 'com.android.tools.build:apksig:8.2.0'
}
